[package]
name = "craft-publik"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "The publik module for the Craft apps: Sign in with publik (the gate), usage counting, provisioning, the credential file, OpenAI-compatible calls, the own-key path, and the egui gate panel and setup flow"
repository = "https://github.com/Blueturboguy07/craft-publik"
publish = false

[features]
default = []
egui = ["dep:egui"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 0.36 and 0.37: the Craft apps moved to egui 0.37 upstream. The setup flow uses only calls both have.
egui = { version = ">=0.36, <0.38", optional = true, default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
